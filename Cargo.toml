[package]
name = "boundless_berry_game"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
rand = { version = "0.8", features = ["std"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true